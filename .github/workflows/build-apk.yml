name: Build Slovak Quest APK

concurrency:
  group: slovak-quest-apk
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "slovak-quest.apk"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        run: base64 -d app/keystore.b64 > app/slovak-debug.jks
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk slovak-quest.apk
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slovak-quest.apk
          git commit -m "Build Slovak Quest APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: slovak-quest-apk
          path: slovak-quest.apk
          if-no-files-found: error
