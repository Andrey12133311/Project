plugins {
    id 'com.android.application'
}

android {
    namespace 'com.andrey.slovakquest'
    compileSdk 35

    signingConfigs {
        sharedDebug {
            storeFile file('slovak-debug.jks')
            storePassword 'slovakquest'
            keyAlias 'slovakquest'
            keyPassword 'slovakquest'
        }
    }

    defaultConfig {
        applicationId 'com.andrey.slovakquest'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0-offline'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sharedDebug
        }
    }
}

dependencies {
}
